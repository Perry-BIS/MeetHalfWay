<svg xmlns="http://www.w3.org/2000/svg" width="860" height="1820" viewBox="0 0 860 1820">
  <defs>
    <linearGradient id="titleBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a4a7a"/>
      <stop offset="100%" stop-color="#2562a8"/>
    </linearGradient>
    <!-- per-phase accent colors -->
    <filter id="sf" x="-4%" y="-8%" width="108%" height="124%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#b0c4d8" flood-opacity="0.30"/>
    </filter>
    <marker id="arr" viewBox="0 0 12 12" refX="6" refY="10" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M2 2 L6 10 L10 2" fill="none" stroke="#5a8ab8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrB" viewBox="0 0 12 12" refX="6" refY="10" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M2 2 L6 10 L10 2" fill="none" stroke="#b0c8e8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- White page -->
  <rect width="860" height="1820" fill="#ffffff"/>
  <rect width="860" height="1820" fill="none" stroke="#e2e8f0" stroke-width="2"/>

  <!-- ── TITLE ── -->
  <rect x="0" y="0" width="860" height="68" fill="url(#titleBar)"/>
  <text x="36" y="44" style="font:700 26px 'Segoe UI',Arial,sans-serif; fill:#ffffff;">Program Logic: Receive Location → Return Results</text>
  <text x="734" y="44" style="font:400 13px 'Segoe UI',Arial,sans-serif; fill:#a8c8f0;">MeetHalfway AI</text>

  <!-- ═══ PHASE 0: Input ═══ -->
  <!-- trigger node -->
  <rect x="280" y="90" width="300" height="50" rx="25" fill="#1a4a7a" filter="url(#sf)"/>
  <text x="430" y="121" text-anchor="middle" style="font:700 14px 'Segoe UI',Arial,sans-serif; fill:#ffffff;">User A &amp; User B submit info</text>

  <!-- arrow -->
  <line x1="430" y1="140" x2="430" y2="164" stroke="#5a8ab8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- STEP 1 -->
  <rect x="50" y="168" width="760" height="80" rx="12" fill="#f0f6ff" stroke="#c5d8f0" stroke-width="1.5" filter="url(#sf)"/>
  <rect x="50" y="168" width="6" height="80" rx="3" fill="#2e7bd6"/>
  <text x="76" y="197" style="font:700 14.5px 'Segoe UI',Arial,sans-serif; fill:#1a3a6a;">① Geocode addresses → Location objects</text>
  <text x="76" y="220" style="font:400 13px 'Segoe UI',Arial,sans-serif; fill:#4a6a8a;">Mapbox Geocoding API (primary) → OSM Nominatim (fallback). GPS coordinates bypass this step.</text>
  <text x="76" y="238" style="font:400 12px 'Segoe UI',Arial,sans-serif; fill:#7a9ab8;">Output: Location(lat, lon) for both A and B</text>

  <line x1="430" y1="248" x2="430" y2="272" stroke="#5a8ab8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- STEP 2 -->
  <rect x="50" y="276" width="760" height="80" rx="12" fill="#f0f6ff" stroke="#c5d8f0" stroke-width="1.5" filter="url(#sf)"/>
  <rect x="50" y="276" width="6" height="80" rx="3" fill="#2e7bd6"/>
  <text x="76" y="305" style="font:700 14.5px 'Segoe UI',Arial,sans-serif; fill:#1a3a6a;">② Compute commute-bias weights</text>
  <text x="76" y="328" style="font:400 13px 'Segoe UI',Arial,sans-serif; fill:#4a6a8a;">Travel mode (drive/walk/transit) + distance tolerance → per-user weight w_A, w_B.</text>
  <text x="76" y="346" style="font:400 12px 'Segoe UI',Arial,sans-serif; fill:#7a9ab8;">Higher tolerance → lower weight → fair center shifts toward that person.</text>

  <line x1="430" y1="356" x2="430" y2="380" stroke="#5a8ab8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- STEP 3 -->
  <rect x="50" y="384" width="760" height="80" rx="12" fill="#f0f6ff" stroke="#c5d8f0" stroke-width="1.5" filter="url(#sf)"/>
  <rect x="50" y="384" width="6" height="80" rx="3" fill="#2e7bd6"/>
  <text x="76" y="413" style="font:700 14.5px 'Segoe UI',Arial,sans-serif; fill:#1a3a6a;">③ Compute weighted center (fair midpoint)</text>
  <text x="76" y="436" style="font:400 13.5px 'Courier New',monospace; fill:#1a3a6a;">center.lat = (A.lat × w_A + B.lat × w_B) / (w_A + w_B)</text>
  <text x="76" y="454" style="font:400 12px 'Segoe UI',Arial,sans-serif; fill:#7a9ab8;">Tired-person fatigue multiplier (1.3×) nudges center away from fatigued user.</text>

  <line x1="430" y1="464" x2="430" y2="488" stroke="#5a8ab8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ═══ PHASE: Isochrone ═══ -->
  <rect x="50" y="492" width="760" height="36" rx="8" fill="#2558a0"/>
  <text x="430" y="515" text-anchor="middle" style="font:700 13.5px 'Segoe UI',Arial,sans-serif; fill:#ffffff;">Isochrone &amp; Search Area</text>

  <!-- STEP 4 -->
  <rect x="50" y="538" width="760" height="96" rx="12" fill="#f0f6ff" stroke="#c5d8f0" stroke-width="1.5" filter="url(#sf)"/>
  <rect x="50" y="538" width="6" height="96" rx="3" fill="#2e7bd6"/>
  <text x="76" y="567" style="font:700 14.5px 'Segoe UI',Arial,sans-serif; fill:#1a3a6a;">④ Build isochrones  (20-minute travel polygon)</text>
  <!-- fallback chain -->
  <rect x="76" y="578" width="174" height="28" rx="10" fill="#d8eeff" stroke="#90b8e0" stroke-width="1"/>
  <text x="163" y="597" text-anchor="middle" style="font:600 12px 'Segoe UI',Arial,sans-serif; fill:#1a3a6a;">OpenRouteService (ORS)</text>
  <text x="258" y="594" style="font:700 14px 'Segoe UI',Arial,sans-serif; fill:#8aaac8;">→</text>
  <rect x="272" y="578" width="136" height="28" rx="10" fill="#ddeeff" stroke="#90b8e0" stroke-width="1"/>
  <text x="340" y="597" text-anchor="middle" style="font:600 12px 'Segoe UI',Arial,sans-serif; fill:#1a3a6a;">Mapbox Isochrone</text>
  <text x="416" y="594" style="font:700 14px 'Segoe UI',Arial,sans-serif; fill:#8aaac8;">→</text>
  <rect x="430" y="578" width="160" height="28" rx="10" fill="#e8f0ff" stroke="#90b8e0" stroke-width="1"/>
  <text x="510" y="597" text-anchor="middle" style="font:600 12px 'Segoe UI',Arial,sans-serif; fill:#1a3a6a;">Circle approximation</text>
  <text x="76" y="626" style="font:400 12px 'Segoe UI',Arial,sans-serif; fill:#7a9ab8;">Intersection of A-polygon ∩ B-polygon defines the reachable fair zone.</text>

  <line x1="430" y1="634" x2="430" y2="658" stroke="#5a8ab8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- STEP 5 -->
  <rect x="50" y="662" width="760" height="80" rx="12" fill="#f0f6ff" stroke="#c5d8f0" stroke-width="1.5" filter="url(#sf)"/>
  <rect x="50" y="662" width="6" height="80" rx="3" fill="#2e7bd6"/>
  <text x="76" y="691" style="font:700 14.5px 'Segoe UI',Arial,sans-serif; fill:#1a3a6a;">⑤ Search nearby venues  (multi-type, deduplicated)</text>
  <text x="76" y="714" style="font:400 13px 'Segoe UI',Arial,sans-serif; fill:#4a6a8a;">For each selected venue type  →  Mapbox POI →  Overpass QL  →  OSM Nominatim.</text>
  <text x="76" y="732" style="font:400 12px 'Segoe UI',Arial,sans-serif; fill:#7a9ab8;">Results merged and deduplicated by (name, lat≈, lon≈). Up to 8 venues per type, 3 types.</text>

  <line x1="430" y1="742" x2="430" y2="766" stroke="#5a8ab8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- STEP 6 -->
  <rect x="50" y="770" width="760" height="64" rx="12" fill="#f0f6ff" stroke="#c5d8f0" stroke-width="1.5" filter="url(#sf)"/>
  <rect x="50" y="770" width="6" height="64" rx="3" fill="#2e7bd6"/>
  <text x="76" y="799" style="font:700 14.5px 'Segoe UI',Arial,sans-serif; fill:#1a3a6a;">⑥ Tag each venue: inside or outside isochrone intersection</text>
  <text x="76" y="822" style="font:400 13px 'Segoe UI',Arial,sans-serif; fill:#4a6a8a;">venue.in_isochrone_intersection = point-in-polygon (intersection geometry)</text>

  <line x1="430" y1="834" x2="430" y2="858" stroke="#5a8ab8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ═══ PHASE: Enrichment ═══ -->
  <rect x="50" y="862" width="760" height="36" rx="8" fill="#2558a0"/>
  <text x="430" y="885" text-anchor="middle" style="font:700 13.5px 'Segoe UI',Arial,sans-serif; fill:#ffffff;">Async Enrichment  (parallel per-venue)</text>

  <!-- STEP 7 -->
  <rect x="50" y="908" width="760" height="96" rx="12" fill="#f0f6ff" stroke="#c5d8f0" stroke-width="1.5" filter="url(#sf)"/>
  <rect x="50" y="908" width="6" height="96" rx="3" fill="#1a9060"/>
  <text x="76" y="937" style="font:700 14.5px 'Segoe UI',Arial,sans-serif; fill:#1a3a6a;">⑦ Web enrichment  (asyncio, semaphore-capped)</text>
  <!-- two columns -->
  <rect x="76" y="948" width="340" height="44" rx="10" fill="#e8f8f0" stroke="#88d8a8" stroke-width="1"/>
  <text x="246" y="968" text-anchor="middle" style="font:700 13px 'Segoe UI',Arial,sans-serif; fill:#1a5a3a;">Tavily Search API</text>
  <text x="246" y="986" text-anchor="middle" style="font:400 12px 'Segoe UI',Arial,sans-serif; fill:#3a7a5a;">→ DuckDuckGo fallback (no key needed)</text>
  <rect x="434" y="948" width="340" height="44" rx="10" fill="#e0f4f8" stroke="#80c8d8" stroke-width="1"/>
  <text x="604" y="968" text-anchor="middle" style="font:700 13px 'Segoe UI',Arial,sans-serif; fill:#1a4a5a;">Yelp Fusion API</text>
  <text x="604" y="986" text-anchor="middle" style="font:400 12px 'Segoe UI',Arial,sans-serif; fill:#3a6a7a;">Blend rating_proxy with review confidence</text>

  <line x1="430" y1="1004" x2="430" y2="1028" stroke="#5a8ab8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- STEP 8 -->
  <rect x="50" y="1032" width="760" height="80" rx="12" fill="#f0f6ff" stroke="#c5d8f0" stroke-width="1.5" filter="url(#sf)"/>
  <rect x="50" y="1032" width="6" height="80" rx="3" fill="#1a9060"/>
  <text x="76" y="1061" style="font:700 14.5px 'Segoe UI',Arial,sans-serif; fill:#1a3a6a;">⑧ LLM extraction  (optional, low_cost_mode bypassed)</text>
  <text x="76" y="1084" style="font:400 13px 'Segoe UI',Arial,sans-serif; fill:#4a6a8a;">Structured JSON interpretation via OpenAI-compatible model → extract status, crowd, wait, promo, risk.</text>
  <text x="76" y="1102" style="font:400 12px 'Segoe UI',Arial,sans-serif; fill:#7a9ab8;">Fallback: keyword regex extraction when no LLM available.</text>

  <line x1="430" y1="1112" x2="430" y2="1136" stroke="#5a8ab8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- STEP 9 -->
  <rect x="50" y="1140" width="760" height="64" rx="12" fill="#fff8f0" stroke="#f0d8b0" stroke-width="1.5" filter="url(#sf)"/>
  <rect x="50" y="1140" width="6" height="64" rx="3" fill="#d08030"/>
  <text x="76" y="1169" style="font:700 14.5px 'Segoe UI',Arial,sans-serif; fill:#5a2a00;">⑨ Filter closed venues</text>
  <text x="76" y="1192" style="font:400 13px 'Segoe UI',Arial,sans-serif; fill:#6a4a20;">Remove venues where status = "closed". If all closed → return no_open_candidates error.</text>

  <line x1="430" y1="1204" x2="430" y2="1228" stroke="#5a8ab8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ═══ PHASE: Scoring ═══ -->
  <rect x="50" y="1232" width="760" height="36" rx="8" fill="#2558a0"/>
  <text x="430" y="1255" text-anchor="middle" style="font:700 13.5px 'Segoe UI',Arial,sans-serif; fill:#ffffff;">MCDM Scoring</text>

  <!-- STEP 10 -->
  <rect x="50" y="1278" width="760" height="112" rx="12" fill="#f0f6ff" stroke="#c5d8f0" stroke-width="1.5" filter="url(#sf)"/>
  <rect x="50" y="1278" width="6" height="112" rx="3" fill="#702ea0"/>
  <text x="76" y="1307" style="font:700 14.5px 'Segoe UI',Arial,sans-serif; fill:#1a3a6a;">⑩ Score all candidates  (score_candidates)</text>
  <!-- Score formula summary -->
  <rect x="76" y="1316" width="724" height="62" rx="8" fill="#f3eeff" stroke="#c8a8e8" stroke-width="1"/>
  <text x="96" y="1338" style="font:600 12.5px 'Courier New',monospace; fill:#3a1a6a;">raw = 0.34×dist + 0.25×rating + 0.21×fairness + 0.9×spatiotemporal</text>
  <text x="96" y="1358" style="font:600 12.5px 'Courier New',monospace; fill:#3a1a6a;">      + iso_bonus + 0.25×promo − 0.5×risk − status_p − crowd_p</text>
  <text x="96" y="1374" style="font:400 12px 'Segoe UI',Arial,sans-serif; fill:#6a3a9a;">final_score = max(0, raw)  |  score_breakdown stored per venue</text>

  <line x1="430" y1="1390" x2="430" y2="1414" stroke="#5a8ab8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- STEP 11 -->
  <rect x="50" y="1418" width="760" height="64" rx="12" fill="#f0f6ff" stroke="#c5d8f0" stroke-width="1.5" filter="url(#sf)"/>
  <rect x="50" y="1418" width="6" height="64" rx="3" fill="#702ea0"/>
  <text x="76" y="1447" style="font:700 14.5px 'Segoe UI',Arial,sans-serif; fill:#1a3a6a;">⑪ Apply ambiance preference post-filter</text>
  <text x="76" y="1470" style="font:400 13px 'Segoe UI',Arial,sans-serif; fill:#4a6a8a;">Re-weight candidates based on combined A+B ambiance vote (quiet/lively/balanced). Sort descending.</text>

  <line x1="430" y1="1482" x2="430" y2="1506" stroke="#5a8ab8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- STEP 12 -->
  <rect x="50" y="1510" width="760" height="80" rx="12" fill="#f0f6ff" stroke="#c5d8f0" stroke-width="1.5" filter="url(#sf)"/>
  <rect x="50" y="1510" width="6" height="80" rx="3" fill="#702ea0"/>
  <text x="76" y="1539" style="font:700 14.5px 'Segoe UI',Arial,sans-serif; fill:#1a3a6a;">⑫ Generate AI explanation text  +  Surprise Pick</text>
  <text x="76" y="1562" style="font:400 13px 'Segoe UI',Arial,sans-serif; fill:#4a6a8a;">Per-venue text via LLM or template. Surprise pick: random venue from score &gt; 0.5 pool.</text>
  <text x="76" y="1580" style="font:400 12px 'Segoe UI',Arial,sans-serif; fill:#7a9ab8;">Build score_breakdown explanations for UI display.</text>

  <line x1="430" y1="1590" x2="430" y2="1614" stroke="#5a8ab8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- STEP 13 -->
  <rect x="50" y="1618" width="760" height="64" rx="12" fill="#f0f6ff" stroke="#c5d8f0" stroke-width="1.5" filter="url(#sf)"/>
  <rect x="50" y="1618" width="6" height="64" rx="3" fill="#1a7090"/>
  <text x="76" y="1647" style="font:700 14.5px 'Segoe UI',Arial,sans-serif; fill:#1a3a6a;">⑬ Generate interactive Folium map (HTML)</text>
  <text x="76" y="1670" style="font:400 13px 'Segoe UI',Arial,sans-serif; fill:#4a6a8a;">Markers for A, B, center, top venues. Popup: name, score, fairness delta, isochrone tag.</text>

  <line x1="430" y1="1682" x2="430" y2="1706" stroke="#5a8ab8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- OUTPUT node -->
  <rect x="160" y="1710" width="540" height="68" rx="22" fill="#1a4a7a" filter="url(#sf)"/>
  <text x="430" y="1740" text-anchor="middle" style="font:700 15px 'Segoe UI',Arial,sans-serif; fill:#ffffff;">Return: Top 5 venues + Surprise Pick + Map + Explanations</text>
  <text x="430" y="1762" text-anchor="middle" style="font:400 13px 'Segoe UI',Arial,sans-serif; fill:#a8c8f0;">Displayed in Streamlit UI with score cards and Folium embed</text>

  <!-- ── FOOTER ── -->
  <line x1="30" y1="1798" x2="830" y2="1798" stroke="#dde8f4" stroke-width="1.2"/>
  <text x="430" y="1812" text-anchor="middle" style="font:400 11.5px 'Segoe UI',Arial,sans-serif; fill:#8aa0b8; letter-spacing:1px;">
    MeetHalfway AI  ·  Each arrow represents data handoff between engine methods
  </text>
</svg>
